[package]
name = "consensus"
version = "6.7.5"
authors = ["Rivtower Technologies <contact@rivtower.com>"]
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["cargo"] }
tonic = "0.14"
toml = "1.0"
rand = "0.9"
# `release_max_level_trace` enables configuring log level at runtime.
slog = { version = "2.8", features = ["release_max_level_trace"] }
sloggers = "2.2"
log = "0.4"
hex = "0.4"
raft = { git = "https://github.com/rink1969/raft-rs.git", default-features = false, features = ["prost-codec"] }
prost = "0.14"
tokio = { version = "1.49", features = ["fs", "io-util", "rt", "macros"] }
serde = "1.0"
bytes = "1.11"
tower = "0.5"
flume = "0.12"

cloud-util = { package = "cloud-util", git = "https://github.com/cita-cloud/cloud-common-rs", branch = "update" }
cita_cloud_proto = { package = "cita_cloud_proto", git = "https://github.com/cita-cloud/cloud-common-rs", branch = "update" }

[dev-dependencies]
tempfile = "3.26"
